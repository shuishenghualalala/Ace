- Crew 可以把一次需求拆成可跟踪的任务，让执行过程更透明。
- Crew 支持直接执行，也支持先规划、确认后再执行。
- Crew 会把工具调用、执行进度和最终结果清晰展示，方便回看。
- Crew 的场景推荐可以预填常见任务，减少重复描述。
- Crew 支持长时间运行的任务，也可以把后续需求加入队列。
- Crew 可以绑定技能、外援智能体和团队，为任务选择合适的执行方式。
- Crew 会保留会话历史，方便继续追问和复盘上下文。
- Crew 的工作空间可以隔离不同项目的文件与项目说明。
- Crew 的 Wiki 可以整理、检索和关联项目知识。
- Crew 支持单次和周期定时任务，并按创建者身份隔离执行。
- 安装第三方技能或插件前，请检查来源、权限和网络访问范围。
- 输出到工作空间以外的位置时，Crew 会先请求你的确认。

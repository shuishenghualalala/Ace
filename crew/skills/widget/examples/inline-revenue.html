<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>收益情景分析</title>
<style>
body{font:14px system-ui;color:#e6e8ef;background:#191b22;padding:20px;margin:0}h2{font-size:18px;margin:0 0 8px}p{color:#a8adbc}.inputs,.cards{display:flex;gap:16px;flex-wrap:wrap;margin:18px 0}label,.card{flex:1;min-width:160px}input{width:100%;margin-top:8px;accent-color:#7ba9ff}input[type=number]{padding:8px;background:#252934;border:1px solid #52596c;border-radius:6px;color:inherit}.card{background:#252934;padding:12px;border-radius:10px}.card strong{display:block;font-size:22px;margin-top:6px}svg{width:100%;height:auto;overflow:visible}button{background:#30384b;color:inherit;border:1px solid #63718d;padding:8px 12px;border-radius:6px;cursor:pointer}text{fill:#a8adbc;font:12px system-ui}.legend{display:flex;gap:20px}.legend span:before{content:'●';color:var(--c);margin-right:6px}
</style></head><body>
<h2>12 个月收益情景分析</h2><p>示例模型：收入按情景系数增长，扣除每月成本及一次性投入。调整参数即可重算。</p>
<div class="inputs"><label>每月成本（元）<input id="cost" name="cost" type="range" min="0" max="20000" step="100"><output id="costLabel"></output></label><label>首月收入（元）<input id="income" name="income" type="number" min="0" max="1000000" step="100" required></label><label>初始投入（元）<input id="initial" name="initial" type="number" min="0" max="1000000" step="100" required></label></div>
<div class="cards" id="cards"></div><svg viewBox="0 0 640 260" role="img" aria-label="12个月累计现金利润折线图"><g id="chart"></g></svg>
<div class="legend"><span style="--c:#78aaff">悲观</span><span style="--c:#72ce9b">基准</span><span style="--c:#ffae70">乐观</span></div><p>横轴：月份；纵轴：累计利润（元）。情景假设仅用于演示。</p><button id="reset" type="button">恢复默认参数</button>
<script>
const api=window.AceInteractive;
const defaults={cost:6000,income:8000,initial:3000};
const fields=['cost','income','initial'];
const params={...defaults,...api.state};
for(const id of fields)document.getElementById(id).value=params[id];
function render(){
  if(!fields.every(id=>document.getElementById(id).checkValidity()))return;
  const p=Object.fromEntries(fields.map(id=>[id,Number(document.getElementById(id).value)]));
  document.getElementById('costLabel').textContent='¥'+p.cost.toLocaleString();
  const scenarios=[['悲观',.7,0,'#78aaff'],['基准',1,.03,'#72ce9b'],['乐观',1.3,.08,'#ffae70']];
  const series=scenarios.map(([name,factor,growth,color])=>{let sum=-p.initial;return{name,color,values:Array.from({length:12},(_,i)=>sum+=p.income*factor*(1+growth)**i-p.cost)}});
  const min=Math.min(0,...series.flatMap(s=>s.values)),max=Math.max(1,...series.flatMap(s=>s.values));
  const y=v=>220-(v-min)/(max-min)*190;
  document.getElementById('cards').innerHTML=series.map(s=>'<div class="card">'+s.name+' · 年末利润<strong style="color:'+s.color+'">¥'+Math.round(s.values[11]).toLocaleString()+'</strong></div>').join('');
  document.getElementById('chart').innerHTML=[0,.5,1].map(t=>{const v=min+(max-min)*t;return '<path d="M65 '+y(v)+'H620" stroke="#3b4050"/><text x="0" y="'+(y(v)+4)+'">'+Math.round(v/1000)+'k</text>'}).join('')+series.map(s=>'<polyline fill="none" stroke="'+s.color+'" stroke-width="3" points="'+s.values.map((v,i)=>(65+i*50)+','+y(v)).join(' ')+'"/>').join('')+Array.from({length:12},(_,i)=>'<text x="'+(65+i*50)+'" y="245">'+(i+1)+'</text>').join('');
  api.setState(p);
}
for(const id of fields)document.getElementById(id).addEventListener('input',render);
document.getElementById('reset').onclick=()=>{for(const id of fields)document.getElementById(id).value=defaults[id];render()};render();
</script></body></html>

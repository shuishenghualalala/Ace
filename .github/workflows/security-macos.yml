name: security-macos

on:
  pull_request:
  workflow_dispatch:

jobs:
  native-security:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: '0.11.28'
          python-version: '3.11.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
      - run: npm ci --ignore-scripts --prefix desktop
      - run: npm --prefix desktop run typecheck
      - run: npm --prefix desktop test -- --run tests/unit/bootstrap-hardening.test.ts tests/unit/ipc-schemas.test.ts
      - run: node desktop/scripts/check-security.mjs
      - run: uv sync --extra dev --frozen
      - run: python scripts/audit_runtime_npm.py
      - run: cargo build --manifest-path security-runtime/Cargo.toml --release --locked
      - run: cargo check --manifest-path security-runtime/Cargo.toml --all-targets --locked
      - run: cargo fmt --manifest-path security-runtime/Cargo.toml --check
      - run: cargo clippy --manifest-path security-runtime/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path security-runtime/Cargo.toml --release --locked
        env:
          ACE_REQUIRE_NATIVE_TESTS: '1'
      - run: uv run pytest tests/security -q
      - run: python tests/security/security_matrix.py --platform macos --runtime security-runtime/target/release/ace-security-runtime
        env:
          ACE_REQUIRE_NATIVE_SECURITY: '1'
      - run: node desktop/scripts/prepare-security-runtime.mjs --runtime security-runtime/target/release/ace-security-runtime --source-root security-runtime --output desktop/security-runtime-bin
      - run: node desktop/scripts/verify-security-runtime.mjs desktop/security-runtime-bin
      - run: python scripts/generate_security_sbom.py --output desktop/security-runtime-bin/security-macos-sbom.cdx.json --runtime-manifest desktop/security-runtime-bin/runtime-manifest.json
      - run: node desktop/scripts/prepare-security-runtime.mjs --runtime security-runtime/target/release/ace-security-runtime --source-root security-runtime --output security-runtime/prebuilt/darwin-arm64
      - run: node desktop/scripts/verify-security-runtime.mjs security-runtime/prebuilt/darwin-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-macos-prebuilt
          path: security-runtime/prebuilt/darwin-arm64
      - name: Bind macOS evidence to the tested release artifact
        env:
          EVIDENCE_COMMIT: ${{ github.sha }}
          EVIDENCE_REPOSITORY: ${{ github.repository }}
          EVIDENCE_WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/write_security_runtime_evidence.py
          --repo-root .
          --runtime security-runtime/target/release/ace-security-runtime
          --staged-runtime desktop/security-runtime-bin/ace-security-runtime
          --output security-macos-evidence.json
          --platform macos
          --target-triple aarch64-apple-darwin
          --repository "$EVIDENCE_REPOSITORY"
          --commit "$EVIDENCE_COMMIT"
          --workflow-run "$EVIDENCE_WORKFLOW_RUN"
          --sbom desktop/security-runtime-bin/security-macos-sbom.cdx.json
      - name: Stage macOS SBOM evidence
        run: cp desktop/security-runtime-bin/security-macos-sbom.cdx.json security-macos-sbom.cdx.json
      - name: Stage macOS runtime manifest evidence
        run: cp desktop/security-runtime-bin/runtime-manifest.json runtime-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-macos-unsigned-evidence
          if-no-files-found: error
          path: |
            security-macos-evidence.json
            security-macos-sbom.cdx.json
            runtime-manifest.json

  attest-release-evidence:
    if: github.event_name == 'workflow_dispatch'
    needs: native-security
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: security-macos-unsigned-evidence
      - name: Attest macOS native evidence provenance
        id: native-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            security-macos-evidence.json
            security-macos-sbom.cdx.json
            runtime-manifest.json
      - name: Stage macOS provenance bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.native-attestation.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" security-macos-evidence.sigstore.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-macos-evidence
          if-no-files-found: error
          path: |
            security-macos-evidence.json
            security-macos-evidence.sigstore.json
            security-macos-sbom.cdx.json
            runtime-manifest.json

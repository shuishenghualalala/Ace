name: security-parser-fuzz

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 3'

permissions:
  contents: read

concurrency:
  group: security-parser-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-parser-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ACE_TEST012_SEED: '12648430'
      ACE_TEST012_CASES: ${{ github.event_name == 'schedule' && '512' || '64' }}
      ACE_TEST012_COMMAND_TIMEOUT_SECONDS: '300'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.97.1'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: '0.11.28'
          python-version: '3.11.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
      - run: uv sync --extra dev --frozen
      - run: npm ci --ignore-scripts --prefix desktop
      - name: Run bounded cross-language parser campaign
        run: uv run python scripts/run_parser_fuzz_gate.py
      - name: Upload exact TEST-012 reproducer
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-012-parser-reproducer-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: test-results/test-012/

name: security-windows

on:
  pull_request:
  workflow_dispatch:

jobs:
  native-security:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: '0.11.28'
          python-version: '3.11.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
      - run: npm ci --ignore-scripts --prefix desktop
      - run: npm --prefix desktop run typecheck
      - run: npm --prefix desktop test -- --run tests/unit/bootstrap-hardening.test.ts tests/unit/ipc-schemas.test.ts
      - run: node desktop/scripts/check-security.mjs
      - run: uv sync --extra dev --frozen
      - run: python scripts/audit_runtime_npm.py
      - run: cargo build --manifest-path security-runtime/Cargo.toml --release --locked --target x86_64-pc-windows-msvc
      - run: cargo fmt --manifest-path security-runtime/Cargo.toml --check
      - run: cargo clippy --manifest-path security-runtime/Cargo.toml --all-targets --locked -- -D warnings
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:ACE_SECURITY_STATE_DIR | Out-Null
          & ./security-runtime/target/x86_64-pc-windows-msvc/release/ace-security-runtime.exe --windows-setup $env:ACE_SECURITY_STATE_DIR
          if ($LASTEXITCODE -ne 0) { throw 'release sandbox setup failed' }
        env:
          ACE_SECURITY_STATE_DIR: '${{ runner.temp }}\ace-security-state'
      - run: cargo test --manifest-path security-runtime/Cargo.toml --release --locked --target x86_64-pc-windows-msvc
        env:
          ACE_REQUIRE_NATIVE_TESTS: '1'
          ACE_WINDOWS_NATIVE_STATE_DIR: '${{ runner.temp }}\ace-security-state'
          ACE_SECURITY_STATE_DIR: '${{ runner.temp }}\ace-security-state'
      - run: uv run pytest tests/security -q
      - run: python tests/security/security_matrix.py --platform windows --runtime security-runtime/target/x86_64-pc-windows-msvc/release/ace-security-runtime.exe
        env:
          ACE_REQUIRE_NATIVE_SECURITY: '1'
          ACE_SECURITY_STATE_DIR: '${{ runner.temp }}\ace-security-state'
      - shell: pwsh
        run: ./tests/security/windows_install_matrix.ps1 -Runtime ./security-runtime/target/x86_64-pc-windows-msvc/release/ace-security-runtime.exe
      - run: node desktop/scripts/prepare-security-runtime.mjs --runtime security-runtime/target/x86_64-pc-windows-msvc/release/ace-security-runtime.exe --source-root security-runtime --output desktop/security-runtime-bin
      - run: node desktop/scripts/verify-security-runtime.mjs desktop/security-runtime-bin
      - run: python scripts/generate_security_sbom.py --output desktop/security-runtime-bin/security-windows-sbom.cdx.json --runtime-manifest desktop/security-runtime-bin/runtime-manifest.json
      - name: Bind Windows evidence to the tested release artifact
        shell: pwsh
        env:
          EVIDENCE_COMMIT: ${{ github.sha }}
          EVIDENCE_REPOSITORY: ${{ github.repository }}
          EVIDENCE_WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/write_security_runtime_evidence.py
          --repo-root .
          --runtime security-runtime/target/x86_64-pc-windows-msvc/release/ace-security-runtime.exe
          --staged-runtime desktop/security-runtime-bin/ace-security-runtime.exe
          --output security-windows-evidence.json
          --platform windows
          --target-triple x86_64-pc-windows-msvc
          --repository "$env:EVIDENCE_REPOSITORY"
          --commit "$env:EVIDENCE_COMMIT"
          --workflow-run "$env:EVIDENCE_WORKFLOW_RUN"
          --sbom desktop/security-runtime-bin/security-windows-sbom.cdx.json
      - name: Stage Windows SBOM evidence
        shell: pwsh
        run: Copy-Item -LiteralPath desktop/security-runtime-bin/security-windows-sbom.cdx.json -Destination security-windows-sbom.cdx.json
      - name: Stage Windows runtime manifest evidence
        shell: pwsh
        run: Copy-Item -LiteralPath desktop/security-runtime-bin/runtime-manifest.json -Destination runtime-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-windows-unsigned-evidence
          if-no-files-found: error
          path: |
            security-windows-evidence.json
            security-windows-sbom.cdx.json
            runtime-manifest.json
      - name: Remove Windows sandbox fixture
        if: always()
        shell: pwsh
        run: ./security-runtime/target/x86_64-pc-windows-msvc/release/ace-security-runtime.exe --windows-uninstall '${{ runner.temp }}\ace-security-state'

  attest-release-evidence:
    if: github.event_name == 'workflow_dispatch'
    needs: native-security
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: security-windows-unsigned-evidence
      - name: Attest Windows native evidence provenance
        id: native-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            security-windows-evidence.json
            security-windows-sbom.cdx.json
            runtime-manifest.json
      - name: Stage Windows provenance bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.native-attestation.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" security-windows-evidence.sigstore.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-windows-evidence
          if-no-files-found: error
          path: |
            security-windows-evidence.json
            security-windows-evidence.sigstore.json
            security-windows-sbom.cdx.json
            runtime-manifest.json

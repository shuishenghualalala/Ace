name: security-linux

on:
  pull_request:
  workflow_dispatch:

jobs:
  native-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --extra dev
      - run: python scripts/audit_runtime_npm.py
      - run: cargo build --manifest-path security-runtime/Cargo.toml --release --locked
      - run: cargo check --manifest-path security-runtime/Cargo.toml --all-targets --locked
      - run: cargo fmt --manifest-path security-runtime/Cargo.toml --check
      - run: cargo clippy --manifest-path security-runtime/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path security-runtime/Cargo.toml --release --locked
        env:
          ACE_REQUIRE_NATIVE_TESTS: '1'
      - run: uv run pytest tests/security -q
      - run: python tests/security/security_matrix.py --platform linux --runtime security-runtime/target/release/ace-security-runtime
        env:
          ACE_REQUIRE_NATIVE_SECURITY: '1'
      - run: node desktop/scripts/prepare-security-runtime.mjs --runtime security-runtime/target/release/ace-security-runtime --bwrap /usr/bin/bwrap --bwrap-license /usr/share/doc/bubblewrap/copyright --bwrap-version "$(dpkg-query -W -f='${Version}' bubblewrap)" --output desktop/security-runtime-bin
      - run: node desktop/scripts/verify-security-runtime.mjs desktop/security-runtime-bin
      - name: Bind Linux evidence to the tested release artifact
        env:
          EVIDENCE_COMMIT: ${{ github.sha }}
          EVIDENCE_REPOSITORY: ${{ github.repository }}
          EVIDENCE_WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/write_security_runtime_evidence.py
          --repo-root .
          --runtime security-runtime/target/release/ace-security-runtime
          --staged-runtime desktop/security-runtime-bin/ace-security-runtime
          --output security-linux-evidence.json
          --platform linux
          --target-triple x86_64-unknown-linux-gnu
          --repository "$EVIDENCE_REPOSITORY"
          --commit "$EVIDENCE_COMMIT"
          --workflow-run "$EVIDENCE_WORKFLOW_RUN"
      - uses: actions/upload-artifact@v4
        with:
          name: security-linux-evidence
          path: security-linux-evidence.json

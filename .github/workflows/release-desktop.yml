name: release-desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 发布已有 Git tag（例如 v1.1.0）；留空则只构建所选分支并上传 artifacts
        required: false
        default: ""
        type: string
      version:
        description: 分支构建版本（例如 1.1.0）；留空读取 deb-package/version.txt，发布 tag 时勿填
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve build source and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - name: Resolve build metadata
        id: metadata
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag || '' }}
          VERSION_INPUT: ${{ inputs.version || '' }}
        run: |
          RELEASE_TAG=""
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          elif [ -n "$TAG_INPUT" ]; then
            RELEASE_TAG="$TAG_INPUT"
          fi
          if [ -n "$RELEASE_TAG" ]; then
            if [ -n "$VERSION_INPUT" ]; then
              echo "发布 tag 时不能覆盖版本号，请清空 version" >&2
              exit 1
            fi
            if [[ "$RELEASE_TAG" != v* ]]; then
              echo "发布 tag 必须以 v 开头（例如 v1.1.0）" >&2
              exit 1
            fi
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="${VERSION_INPUT:-$(tr -d '[:space:]' < deb-package/version.txt)}"
          fi
          # 三平台打包脚本要求 major.minor.patch，提前拒绝非法版本。
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "版本必须为 major.minor.patch（例如 1.1.0）" >&2
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  mac-arm64:
    name: macOS arm64 DMG
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build DMG
        run: ./deb-package/pack_mac.sh "${{ needs.prepare.outputs.version }}" arm64
      - name: Stage release assets
        run: |
          mkdir -p release-output
          mv "crew-desktop_${{ needs.prepare.outputs.version }}_arm64.dmg" release-output/
          mv package-size-report-mac.txt release-output/package-size-report-mac-arm64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac-arm64
          path: release-output/*

  mac-x64:
    name: macOS x64 DMG
    needs: prepare
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build DMG
        run: ./deb-package/pack_mac.sh "${{ needs.prepare.outputs.version }}" x64
      - name: Stage release assets
        run: |
          mkdir -p release-output
          mv "crew-desktop_${{ needs.prepare.outputs.version }}_x64.dmg" release-output/
          mv package-size-report-mac.txt release-output/package-size-report-mac-x64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac-x64
          path: release-output/*

  linux:
    name: Linux UOS + Kylin deb
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - name: Build UOS and Kylin packages
        shell: bash
        run: pwsh ./deb-package/pack_deb.ps1 -Version "$VERSION"
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
      - name: Stage release assets
        run: |
          mkdir -p release-output
          mv "crew-desktop_${{ needs.prepare.outputs.version }}_uos_amd64.deb" release-output/
          mv "crew-desktop_${{ needs.prepare.outputs.version }}_kylin_amd64.deb" release-output/
          mv package-size-report-uos.txt release-output/
          mv package-size-report-kylin.txt release-output/
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-output/*

  windows:
    name: Windows x64 installer
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - name: Install Inno Setup Chinese language
        shell: pwsh
        run: |
          $langs = "C:\Program Files (x86)\Inno Setup 6\Languages"
          if (-not (Test-Path $langs)) { New-Item -ItemType Directory -Force $langs | Out-Null }
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile (Join-Path $langs "ChineseSimplified.isl")
          if (-not (Test-Path (Join-Path $langs "ChineseSimplified.isl"))) { throw "ChineseSimplified.isl was not downloaded" }
      - name: Build Windows installer
        shell: pwsh
        run: ./deb-package/pack_exe.ps1 -Version "$env:VERSION"
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-output | Out-Null
          Copy-Item "dist\Crew_Setup_v$env:VERSION.exe" release-output\
          Copy-Item "dist\package-size-report-windows.txt" release-output\
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-output/*

  release:
    name: Publish GitHub release
    needs: [prepare, mac-arm64, mac-x64, linux, windows]
    if: needs.prepare.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - name: Generate release notes
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cat > RELEASE_NOTES.md <<EOF
          # Crew Desktop v${RELEASE_VERSION}

          ## 如何选择安装包（按你的系统选择对应文件）

          | 你的系统 | 下载文件 |
          | --- | --- |
          | macOS（Apple 芯片 M 系列） | \`crew-desktop_${RELEASE_VERSION}_arm64.dmg\` |
          | macOS（Intel） | \`crew-desktop_${RELEASE_VERSION}_x64.dmg\` |
          | Linux 统信 UOS（amd64） | \`crew-desktop_${RELEASE_VERSION}_uos_amd64.deb\` |
          | Linux 麒麟 Kylin（amd64） | \`crew-desktop_${RELEASE_VERSION}_kylin_amd64.deb\` |
          | Windows 10/11（x64） | \`Crew_Setup_v${RELEASE_VERSION}.exe\` |

          > 桌面端「更新」按钮会自动按当前系统/架构匹配对应安装包，也可在此手动下载。

          ## 校验和

          每个安装包都附有 SHA256 校验值。下载后可在本机核对：

          \`\`\`bash
          # Linux / macOS
          sha256sum -c SHA256SUMS
          # Windows (PowerShell)
          Get-FileHash .\\Crew_Setup_v${RELEASE_VERSION}.exe -Algorithm SHA256
          \`\`\`
          EOF
          # 校验说明文件已生成且包含版本号
          grep -q "v${RELEASE_VERSION}" RELEASE_NOTES.md
          echo "RELEASE_NOTES.md ready"
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --prerelease --notes-file RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

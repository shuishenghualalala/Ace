# Only exact, inert test canaries may bypass secret findings. Never exempt a
# directory or a generic credential shape: real credentials in tests must fail.
allow-rules:
  - id: ace-inert-openai-test-canaries
    description: Exact synthetic API keys used by redaction tests
    regex: 'sk-(example-secret-token-123456|audit-field-canary-1234567890|test-super-secret-token-123456789|ant-(abcdefghijklmnop|titleabcdefghijkl)|test-12345678901234567890|live-abcdef1234567890abcdef|abcdef1234567890ABCDEF|abcdefghijklmnopqrstuvwxyz123456)'
  - id: ace-inert-aws-test-canary
    description: AWS documentation-style test identifier
    regex: 'AKIAEXAMPLEACCESSKEY'
  - id: ace-inert-private-key-test-canaries
    description: Exact non-key payloads used by browser-boundary tests
    regex: '(real-multiline-secret-material|-----BEGIN PRIVATE KEY----- secret -----END PRIVATE KEY-----)'

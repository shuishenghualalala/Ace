# electron-builder 配置
#
# 目的：输出"裸目录"（linux-unpacked/、win-unpacked/ 或 mac-*-unpacked/），
# 供本地验证或下游发行流水线使用。因此这里只用 dir target，不直接生成
# .deb / NSIS / DMG installer。
#
# 使用方式（在 desktop/ 下）：
#   npm run dist:linux    # 产物：release/linux-unpacked/
#   npm run dist:win      # 产物：release/win-unpacked/
# 注意 dist:win 必须在 Windows 主机上跑（Electron Windows 二进制 + 代码页）。

appId: com.crew.desktop
productName: crew-desktop
copyright: Copyright (c) Crew Contributors

directories:
  output: release
  buildResources: build

# 只打包运行时必需的产物与 package.json 声明的生产依赖。Electron 本体（含其
# 内置 Chromium）由 electron-builder 提供——浏览器自动化走 ElectronCdpTransport
# 驱动应用自己的 WebContentsView，不需要另一个 Chromium 二进制。
files:
  - dist/**/*
  - package.json
  - "!**/.DS_Store"

# 不再打包任何 Playwright-managed Chromium（约 500MB/平台）：运行时用 Electron
# 自带的 Chromium，那 500MB 从来没被执行过。曾经打包它的 ManagedChromiumEngine
# 没接线，已整体移除。将来若真要 managed 引擎，在此重新声明 extraResources 并
# 恢复 browser:stage 步骤。
extraResources: []

# Linux target：dir 即"未打包目录"。
linux:
  target:
    - target: dir
      arch:
        - x64
  # 显式指定可执行文件名。electron-builder v24.x 在 Linux 上：
  # 若未设置 linux.executableName / 顶层 executableName，会回退到
  # package.json 的 name 字段小写化（→ crew-desktop-ui），
  # 而非 productName。此处显式声明，使 Linux 与 Windows (crew-desktop.exe)
  # 产物统一使用 crew-desktop 名称，便于下游打包脚本稳定引用。
  executableName: crew-desktop
  icon: assets/icon.png
  category: Utility
  maintainer: Crew Contributors <maintainers@example.com>
  vendor: Crew Contributors
  synopsis: Crew Desktop Client
  description: |
    Crew Desktop - Electron-based GUI client for the
    Crew gateway. Bundled with the crew-gateway service
    in a single .deb installation package.

# Windows target：同样输出 win-unpacked/ 裸目录。
# - 不打 NSIS 安装器，避免引入额外工具链（makensis）与代码签名复杂度
# - 开发构建默认不做代码签名，避免缺少 signtool 或证书时失败
#   signAndEditExecutable=false 同时关掉"签 + 改 PE 头"两步
#   如未来需要正式发布，再配置证书并改回 true
# - 图标暂用源 PNG，electron-builder 在 Windows 上能直接处理 PNG→ICO
#   若未来 Windows 构建需要更严谨的 .ico，提交一份 assets/icon.ico 即可
win:
  icon: assets/icon.png
  signAndEditExecutable: false
  target:
    - target: dir
      arch:
        - x64

# macOS target：同样输出 mac-unpacked/（或 mac-arm64-unpacked/）裸目录。
# - 开发构建默认不做代码签名；正式发布时再配置 Apple Developer 证书，
#   首次运行需用户右键 → 打开 以绕过 Gatekeeper
# - 直接使用仓库内的通用 PNG 图标，由 electron-builder 生成平台图标
# - 默认只构建当前 host arch；双架构发布分别在对应架构 runner 执行
#   dist:mac:x64 / dist:mac:arm64。
mac:
  icon: assets/icon.png
  category: public.app-category.productivity
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dir

# Electron 二进制下载镜像（中国大陆 Docker 构建环境友好）
# 在 Dockerfile.pack 里也会通过 ENV 再次设置
# electronBuilderMirror: https://npmmirror.com/mirrors/electron-builder/


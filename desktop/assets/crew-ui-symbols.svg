      .shell{fill:var(--crew-shell,#c7d9e6);stroke:var(--crew-line,#514b43);stroke-width:1.8;stroke-linejoin:round}
      .face{fill:var(--crew-face,#f7f5ee);stroke:var(--crew-line,#514b43);stroke-width:1.45}
      .accent{fill:var(--crew-accent,#b8c6af);stroke:var(--crew-line,#514b43);stroke-width:1.55;stroke-linejoin:round}
      .accent2{fill:var(--crew-accent-2,#e7d29b);stroke:var(--crew-line,#514b43);stroke-width:1.55;stroke-linejoin:round}
      .ink{fill:var(--crew-line,#514b43)}
      .paper{fill:var(--crew-face,#f7f5ee)}

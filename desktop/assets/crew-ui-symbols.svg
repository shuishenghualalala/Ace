<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <style>
      .line{fill:none;stroke:var(--crew-line,#514b43);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

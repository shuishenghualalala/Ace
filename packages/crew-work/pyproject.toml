[project]
name = "crew-work"
version = "0.1.0"
description = "Crew work feature package - 办公助手业务域（事项/简报/偏好/知识）（import 名保持 crew.work，ADR-0037 第三批 workspace 成员）"
license = "Apache-2.0"
requires-python = ">=3.11"
# 依赖根包 crew（workspace 源）：work 的 core 契约、状态设施（crew.state）、
# hook 注册表与独立库设施（work.db，ADR-0038 第二批）仍在根包；knowledge 域
# 复用知识库服务键与页面 Schema（crew.wiki.service/schemas），已随 6P 成员包
# crew-wiki 发布，故同列 workspace 成员依赖（wiki 重型解析依赖仍留在其
# `wiki` extra，不随此基础依赖安装）。
dependencies = [
    "crew",
    "crew-wiki",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 打包 src/crew 整层（editable 安装时 hatchling 会把 src/ 加进 sys.path，
# 使顶层 crew 命名空间同时包含仓库根与成员 src 两部分）；src/crew 下只有 work，
# 故 wheel 内容即 crew/work/**（纯 .py，无附加资产）。
# 成员侧 crew/ 目录不放 __init__.py：纯 PEP 420 namespace portion，
# 与根包的顶层 crew 命名空间（6P）同型；crew/work/ 亦不设 __init__.py，
# 原 re-export 的消费方已改直连子模块导入（6Y）。
[tool.hatch.build.targets.wheel]
packages = ["src/crew"]

[tool.uv.sources]
# crew 即 workspace 根包（仓库根 pyproject），仅从 workspace 解析。
crew = { workspace = true }
crew-wiki = { workspace = true }

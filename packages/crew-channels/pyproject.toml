[project]
name = "crew-channels"
version = "0.1.0"
description = "Crew channels feature package - 消息渠道平台适配、投递与会话路由（import 名保持 crew.channels，ADR-0037 第三批 workspace 成员）"
license = "Apache-2.0"
requires-python = ">=3.11"
# 依赖根包 crew（workspace 源）：channels 的 core 契约、状态设施（crew.state）
# 与宿主装配协议仍在根包；feishu/weixin 平台 SDK 由根包 extras（lark-oapi、
# aiohttp/cryptography/qrcode）按需提供，未安装时平台显示 unavailable。
dependencies = [
    "crew",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 打包 src/crew 整层（editable 安装时 hatchling 会把 src/ 加进 sys.path，
# 使顶层 crew 命名空间同时包含仓库根与成员 src 两部分）；src/crew 下只有
# channels，故 wheel 内容即 crew/channels/**（纯 .py，无附加资产）。
# 成员侧 crew/ 目录不放 __init__.py：纯 PEP 420 namespace portion，
# 与根包的顶层 crew 命名空间（6P）同型；crew/channels/ 亦不设 __init__.py，
# 原 re-export 的消费方已改直连子模块导入（6Y）。
[tool.hatch.build.targets.wheel]
packages = ["src/crew"]

[tool.uv.sources]
# crew 即 workspace 根包（仓库根 pyproject），仅从 workspace 解析。
crew = { workspace = true }

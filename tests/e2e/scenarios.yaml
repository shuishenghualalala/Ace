      请读取 toy_project/input.txt，然后在 toy_project/claude_output.txt 写入数字加 1 的结果。
    expected_files:
      - path: "toy_project/claude_output.txt"
        contains: ["11"]
    expected_final_keywords: ["claude_output.txt"]
    timeout_seconds: 360

  external_kimi:
    title: Kimi 外援写入文件
    mode: external
    runtime_provider: kimi
    workspace:
      instructions: 这是 E2E 玩具工作区，请只操作当前工作区内的文件。
